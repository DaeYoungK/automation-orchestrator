spring:
  application:
    name: automation
  datasource:
    url: jdbc:mysql://localhost:3306/orchestrator
    username: automation
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.automation.commerce.dto

scheduler:
  low-stock:
    cron: "0 0 9 * * *"

automation:
  low-stock:
    threshold: 5

